<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcel Proof - Dashboard</title>
<style>
  :root {
    --bg: #FFFFFF;
    --panel: #F3F5F8;
    --panel-border: #DEE2E8;
    --navy: #002F5C;
    --navy-dim: #B7C4D3;
    --text: #14181F;
    --text-dim: #6B7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header img { height: 34px; width: auto; }
  .title-block h1 {
    margin: 0 0 2px;
    font-size: 20px;
    letter-spacing: 0.01em;
  }
  .sub { color: var(--text-dim); font-size: 13.5px; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--panel-border);
  }
  select, input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  select:focus, input[type="text"]:focus { outline: none; border-color: var(--navy); }
  input[type="text"] { min-width: 220px; }
  .count-pill {
    margin-left: auto;
    color: var(--text-dim);
    font-size: 13px;
    align-self: center;
  }

  .stats-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 16px 28px 0;
  }
  .stat {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 90px;
  }
  .stat .stat-value { font-size: 20px; font-weight: 700; color: var(--navy); line-height: 1.1; }
  .stat .stat-label { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  #grid {
    padding: 20px 28px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 1px 2px rgba(20, 24, 31, 0.04), 0 4px 10px rgba(20, 24, 31, 0.06);
  }
  .card img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    background: #E9ECF1;
    cursor: pointer;
    display: block;
  }
  .card-body { padding: 12px 14px 14px; }
  .invoice { font-weight: 700; font-size: 15px; margin-bottom: 4px; word-break: break-all; }
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .wh-tag {
    color: var(--navy);
    border: 1px solid var(--navy-dim);
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }

  #loading, #empty {
    padding: 70px 28px;
    text-align: center;
    color: var(--text-dim);
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  #loading.show, #empty.show { display: flex; }

  .spinner {
    width: 30px; height: 30px;
    border: 3px solid var(--panel-border);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #empty svg { width: 44px; height: 44px; }

  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; align-items: center; justify-content: center;
    padding: 30px; z-index: 20; cursor: zoom-out;
  }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
</style>
</head>
<body>
  <header>
    <img src="logo.png" alt="Company logo">
    <div class="title-block">
      <h1>Parcel Proof - Dashboard</h1>
      <div class="sub">All uploaded packing photos</div>
    </div>
  </header>

  <div class="filters">
    <select id="warehouse-filter">
      <option value="">All warehouses</option>
      <option value="1">Warehouse 1</option>
      <option value="2">Warehouse 2</option>
      <option value="3">Warehouse 3</option>
    </select>
    <input type="text" id="invoice-search" placeholder="Search invoice number...">
    <span class="count-pill" id="count-pill"></span>
  </div>

  <div class="stats-bar" id="stats-bar"></div>

  <div id="loading" class="show">
    <div class="spinner"></div>
    <div>Loading photos...</div>
  </div>
  <div id="empty">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 8l9-5 9 5-9 5-9-5Z" stroke="#B7C4D3" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M3 8v8l9 5 9-5V8" stroke="#B7C4D3" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M12 13v8" stroke="#B7C4D3" stroke-width="1.6"/>
    </svg>
    <div>No photos match your filters.</div>
  </div>
  <div id="grid"></div>

  <div id="lightbox"><img id="lightbox-img" src=""></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
