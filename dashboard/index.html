<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcel Proof - Dashboard</title>
<style>
  :root {
    --bg: #16181B;
    --panel: #1F2226;
    --panel-border: #2C3036;
    --amber: #F5A623;
    --text: #EDEFF2;
    --text-dim: #8C939C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 24px 28px 16px;
    border-bottom: 1px solid var(--panel-border);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    letter-spacing: 0.01em;
  }
  .sub { color: var(--text-dim); font-size: 14px; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 16px 28px;
    border-bottom: 1px solid var(--panel-border);
  }
  select, input[type="text"] {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 14px;
  }
  select:focus, input[type="text"]:focus { outline: none; border-color: var(--amber); }
  input[type="text"] { min-width: 220px; }
  .count-pill {
    margin-left: auto;
    color: var(--text-dim);
    font-size: 13px;
    align-self: center;
  }

  #grid {
    padding: 20px 28px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    background: #0e0f11;
    cursor: pointer;
    display: block;
  }
  .card-body { padding: 12px 14px 14px; }
  .invoice { font-weight: 700; font-size: 15px; margin-bottom: 4px; word-break: break-all; }
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .wh-tag {
    color: var(--amber);
    border: 1px solid #6b4e17;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
  }
  #empty, #loading {
    padding: 60px 28px;
    text-align: center;
    color: var(--text-dim);
  }

  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.88);
    display: none; align-items: center; justify-content: center;
    padding: 30px; z-index: 20; cursor: zoom-out;
  }
  #lightbox.show { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
</style>
</head>
<body>
  <header>
    <h1>Parcel Proof - Dashboard</h1>
    <div class="sub">All uploaded packing photos</div>
  </header>

  <div class="filters">
    <select id="warehouse-filter">
      <option value="">All warehouses</option>
      <option value="1">Warehouse 1</option>
      <option value="2">Warehouse 2</option>
      <option value="3">Warehouse 3</option>
    </select>
    <input type="text" id="invoice-search" placeholder="Search invoice number...">
    <span class="count-pill" id="count-pill"></span>
  </div>

  <div id="loading">Loading photos...</div>
  <div id="empty" style="display:none">No photos match your filters.</div>
  <div id="grid"></div>

  <div id="lightbox"><img id="lightbox-img" src=""></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
