<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Warehouse 3</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #FFFFFF;
    --panel: #F3F5F8;
    --panel-border: #DEE2E8;
    --navy: #002F5C;
    --navy-dim: #B7C4D3;
    --red: #E31E24;
    --green: #1E8E5A;
    --text: #14181F;
    --text-dim: #6B7280;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    padding: 20px 20px 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  header img { height: 40px; width: auto; }
  .warehouse-label {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--navy);
    border: 1.5px solid var(--navy-dim);
    display: inline-block;
    padding: 6px 16px;
    border-radius: 999px;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 20px;
  }
  .input-wrap {
    position: relative;
    width: min(80vw, 320px);
  }
  .input-wrap svg {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    pointer-events: none;
  }
  #invoice-input {
    width: 100%;
    padding: 16px 18px 16px 44px;
    font-size: 18px;
    border-radius: 12px;
    border: 1.5px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
    text-align: left;
    box-shadow: 0 1px 3px rgba(20, 24, 31, 0.05);
  }
  #invoice-input:focus { outline: none; border-color: var(--navy); }
  #invoice-input::placeholder { color: var(--text-dim); }
  #capture-btn {
    width: min(62vw, 260px);
    height: min(62vw, 260px);
    border-radius: 50%;
    background: var(--navy);
    border: none;
    box-shadow: 0 0 0 10px rgba(0, 47, 92, 0.08), 0 14px 28px rgba(0, 47, 92, 0.28), 0 4px 8px rgba(0, 47, 92, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.15s ease;
  }
  #capture-btn:active {
    transform: scale(0.94);
    box-shadow: 0 0 0 10px rgba(0, 47, 92, 0.08), 0 6px 14px rgba(0, 47, 92, 0.22);
  }
  #capture-btn:disabled { background: #C2C8D0; box-shadow: none; }
  #capture-btn svg { width: 42%; height: 42%; }
  .btn-label { font-size: 18px; font-weight: 700; letter-spacing: 0.02em; color: #FFFFFF; }
  #capture-btn .label-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #status {
    font-size: 15px;
    color: var(--text-dim);
    text-align: center;
    min-height: 20px;
    max-width: 320px;
    transition: color 0.15s ease;
  }
  #status.status-ok { color: var(--green); }
  #status.status-error { color: var(--red); }
  #status.status-busy { color: var(--text-dim); }
  footer { padding: 16px 20px calc(16px + env(safe-area-inset-bottom)); text-align: center; font-size: 13px; color: var(--text-dim); }
  #flash {
    position: fixed; inset: 0; background: var(--navy); opacity: 0;
    pointer-events: none; transition: opacity 0.15s ease; z-index: 10;
  }
  #flash.show { opacity: 0.18; transition: none; }

  #success-check {
    position: fixed;
    top: 50%; left: 50%;
    width: 84px; height: 84px;
    margin: -42px 0 0 -42px;
    background: var(--green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 15;
    opacity: 0;
    transform: scale(0.6);
    pointer-events: none;
    box-shadow: 0 10px 24px rgba(30, 142, 90, 0.35);
  }
  #success-check.show {
    animation: check-pop 1.1s ease forwards;
  }
  #success-check svg { width: 40px; height: 40px; }
  @keyframes check-pop {
    0% { opacity: 0; transform: scale(0.6); }
    20% { opacity: 1; transform: scale(1.08); }
    35% { transform: scale(1); }
    80% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1); }
  }
</style>
</head>
<body>
  <div id="flash"></div>
  <div id="success-check">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 13l4 4L19 7" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <header>
    <img src="logo.png" alt="Company logo">
    <span id="warehouse-label" class="warehouse-label">Loading...</span>
  </header>
  <main>
    <div class="input-wrap">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 7h9a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-6" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M7 7V5a2 2 0 0 1 2-2h3l4 4" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9 13h6M9 16h4" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input type="text" id="invoice-input" placeholder="Invoice / Order number" autocomplete="off" inputmode="numeric" pattern="[0-9]*">
    </div>
    <button id="capture-btn">
      <span class="label-wrap">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 8a2 2 0 0 1 2-2h1.2l.9-1.5A2 2 0 0 1 9.83 3.5h4.34a2 2 0 0 1 1.73 1L16.8 6H18a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8Z" stroke="#FFFFFF" stroke-width="1.6"/>
          <circle cx="12" cy="13" r="3.4" stroke="#FFFFFF" stroke-width="1.6"/>
        </svg>
        <span class="btn-label">TAKE PHOTO</span>
      </span>
    </button>
    <div id="status">Ready.</div>
  </main>
  <footer>
    Queued to upload: <span id="queue-count">0</span>
  </footer>

  <input type="file" id="file-input" accept="image/*" capture="environment" style="display:none">

  <script>const WAREHOUSE = "3";</script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
